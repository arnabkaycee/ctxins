name: Nightly Agent CLI Matrix Smoke Tests

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      depth:
        description: 'Version depth per tool (4 = latest and N-3, 2 = latest and N-1)'
        required: false
        default: '4'
        type: choice
        options:
          - '2'
          - '4'
      tools:
        description: 'Comma-separated list of tools to test'
        required: false
        default: 'claude,opencode-v2,opencode-v1,pi,agy'
        type: string
      model:
        description: 'Ollama model to use'
        required: false
        default: 'qwen2.5:0.5b'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-matrix:
    name: Resolve Agent Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolver.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Dynamic Version Matrix
        id: resolver
        run: |
          DEPTH="${{ github.event.inputs.depth || '4' }}"
          TOOLS="${{ github.event.inputs.tools || 'claude,opencode-v2,opencode-v1,pi,agy' }}"
          python3 scripts/ci/resolve_matrix.py \
            --tools "${TOOLS}" \
            --depth "${DEPTH}" \
            --set-github-output

  smoke-test:
    name: "${{ matrix.tool }} @ ${{ matrix.version }} (${{ matrix.tier }})"
    needs: resolve-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: 'latest'

      - name: Install ctxins dependencies
        run: uv sync --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ${{ matrix.tool }} (${{ matrix.version }})
        run: |
          if [ "${{ matrix.package }}" != "agy" ]; then
            echo "Installing npm package ${{ matrix.package }}@${{ matrix.version }}..."
            npm install -g "${{ matrix.package }}@${{ matrix.version }}" || echo "Install warning (proceeding with runner)"
          else
            echo "Tool ${{ matrix.tool }} uses local/system binary or fallback emulation."
          fi

      - name: Install and Launch Ollama
        run: |
          echo "Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          echo "Starting Ollama server daemon..."
          ollama serve > /tmp/ollama.log 2>&1 &
          
          # Wait for Ollama service readiness
          for i in {1..30}; do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready!"
              break
            fi
            sleep 1
          done

      - name: Pull Model (${{ github.event.inputs.model || 'qwen2.5:0.5b' }})
        run: |
          MODEL="${{ github.event.inputs.model || 'qwen2.5:0.5b' }}"
          echo "Pulling ${MODEL}..."
          ollama pull "${MODEL}"

      - name: Run Smoke Test with ctxins
        env:
          MODEL: ${{ github.event.inputs.model || 'qwen2.5:0.5b' }}
        run: |
          ./scripts/ci/run_smoke_test.sh "${{ matrix.tool }}" "${{ matrix.version }}"

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "logs-${{ matrix.tool }}-${{ matrix.version }}"
          path: |
            /tmp/ollama.log
            ~/.ctxins/ctxins.log
          if-no-files-found: ignore
