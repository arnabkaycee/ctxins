name: Security Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vulnerability-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Audit Dependencies with pip-audit
        run: uvx pip-audit
