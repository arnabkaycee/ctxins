[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxins"
version = "0.1.0"
description = "Context Inspector for Agentic Harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Arnab Chatterjee", email = "arnabkaycee@gmail.com" }
]
dependencies = [
    "mitmproxy>=10.0.0",
    "tiktoken>=0.7.0",
    "pydantic>=2.5.0",
    "msgpack>=1.0.8",
    "textual>=0.70.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
